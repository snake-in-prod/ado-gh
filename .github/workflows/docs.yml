name: Docs

# Called from release.yml for stable tags (GITHUB_TOKEN-created releases
# don't trigger workflows), or run by hand.
on:
  workflow_call:
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - name: Generate reference
        run: |
          go build -o bin/ado ./cmd/ado
          bin/ado help reference --dir docs/reference
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      - name: mkdocs build --strict
        env:
          NO_MKDOCS_2_WARNING: "true"
        run: mkdocs build --strict
      - name: Copy install scripts to site root
        run: cp scripts/install.sh scripts/install.ps1 site/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
