name: Release

# Push one vX.Y.Z or vX.Y.Z-<prerelease> tag from main at a time. Renaming this
# file changes the cosign certificate identity users verify against.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Runs before any secret is in reach: a bad tag or a red test suite never
  # gets to the release environment.
  guard:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is strict SemVer and on main
        run: scripts/release-guard.sh "$GITHUB_REF_NAME"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test
        run: go test ./... -race

  release:
    needs: guard
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      GOTOOLCHAIN: local
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # No module/build cache: release binaries never come from a cache other runs wrote.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3
      - name: Install git-cliff v2.14.2
        run: |
          cd "$RUNNER_TEMP"
          f=git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
          curl -fsSLO "https://github.com/orhun/git-cliff/releases/download/v2.14.2/$f"
          echo "24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4  $f" | sha256sum -c -
          tar xzf "$f"
          echo "$RUNNER_TEMP/git-cliff-2.14.2" >>"$GITHUB_PATH"

      # Body of this version's CHANGELOG.md section, without the dated heading.
      # rc tags are ignored by cliff.toml, so they render as unreleased commits.
      - name: Render release notes
        run: |
          if [[ $TAG == *-* ]]; then
            range=(--unreleased --tag "$TAG")
          else
            range=(--current)
          fi
          git-cliff "${range[@]}" --strip header >"$RUNNER_TEMP/cliff.md"
          heading=$(grep -m1 '^## ' "$RUNNER_TEMP/cliff.md" || true)
          want="## [${TAG#v}](https://github.com/snake-in-prod/ado-gh/releases/tag/$TAG) - "
          if [[ $heading != "$want"* ]]; then
            echo "::error::git-cliff rendered '${heading:-no heading}', want '$want<date>'"
            exit 1
          fi
          sed -e '1,/^## /d' -e '/./,$!d' "$RUNNER_TEMP/cliff.md" >"$RUNNER_TEMP/notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/notes.md"; then
            echo "::error::release notes for $TAG are empty"
            exit 1
          fi
          cat "$RUNNER_TEMP/notes.md"

      # The secret holds only the signing subkey (exported with
      # --export-secret-subkeys FPR!). GoReleaser signs with `-u FPR!` and gets
      # the passphrase on stdin (signs.stdin in .goreleaser.yaml).
      - name: Import GPG signing subkey
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          install -d -m 700 "$GNUPGHOME"
          printf '%s\n' "$GPG_PRIVATE_KEY" | gpg --batch --import
          fpr=$(gpg --batch --with-colons --list-secret-keys |
            awk -F: '$1 == "ssb" { s = ($12 ~ /s/ && $15 != "#"); next } s && $1 == "fpr" { print $10; exit }')
          if [ -z "$fpr" ]; then
            echo "::error::GPG_PRIVATE_KEY holds no usable signing subkey"
            exit 1
          fi
          echo "GNUPGHOME=$GNUPGHOME" >>"$GITHUB_ENV"
          echo "GPG_FINGERPRINT=$fpr!" >>"$GITHUB_ENV"

      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PACKAGES_PAT: ${{ secrets.PACKAGES_PAT }}
          WINGET_PR_PAT: ${{ secrets.WINGET_PR_PAT }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Remove GPG key material
        if: always()
        run: |
          export GNUPGHOME="$RUNNER_TEMP/gnupg"
          gpgconf --kill gpg-agent || true
          rm -rf "$GNUPGHOME"

      # Build provenance for every archive and package listed in checksums.txt,
      # then for checksums.txt itself.
      - id: attest-artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
      - id: attest-checksums
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/checksums.txt
      # Lets users verify offline: gh attestation verify --bundle attestations.jsonl.
      - name: Upload attestation bundle
        env:
          GH_TOKEN: ${{ github.token }}
          ARTIFACTS_BUNDLE: ${{ steps.attest-artifacts.outputs.bundle-path }}
          CHECKSUMS_BUNDLE: ${{ steps.attest-checksums.outputs.bundle-path }}
        run: |
          jq -c . "$ARTIFACTS_BUNDLE" "$CHECKSUMS_BUNDLE" >"$RUNNER_TEMP/attestations.jsonl"
          gh release upload "$TAG" "$RUNNER_TEMP/attestations.jsonl" --repo "$GITHUB_REPOSITORY"

  # Releases created with GITHUB_TOKEN trigger no workflows: call them directly.
  smoke:
    needs: release
    permissions:
      contents: read
      attestations: read
    uses: ./.github/workflows/smoke.yml
    with:
      version: ${{ github.ref_name }}
    secrets:
      SMOKE_ADO_TOKEN: ${{ secrets.SMOKE_ADO_TOKEN }}

  docs:
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: ./.github/workflows/docs.yml
