# git-cliff configuration (https://git-cliff.org), pinned to git-cliff v2.14.2.
#
# Release prep PR (commit as `chore(release): prepare vX.Y.Z`):
#   git cliff --tag vX.Y.Z -o CHANGELOG.md
# Release notes for the tag being released (body only, version heading dropped
# so they match the CHANGELOG.md section regardless of the rendered date):
#   stable vX.Y.Z:  git cliff --current --strip header | sed -e '1,/^## /d' -e '/./,$!d' > notes.md
#   prerelease:     git cliff --unreleased --tag "$TAG" --strip header | sed -e '1,/^## /d' -e '/./,$!d' > notes.md
# Never use --current/--latest on an -rc tag: rc tags are ignored, so they
# render the previous stable section. See docs/releasing.md.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.
Generated by [git-cliff](https://git-cliff.org) from Conventional Commits."""
body = """

{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}](https://github.com/snake-in-prod/ado-gh/releases/tag/{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## Unreleased
{% endif -%}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
{% if commit.breaking and commit.breaking_description != commit.message %}: {{ commit.breaking_description }}{% endif %} \
([{{ commit.id | truncate(length=7, end="") }}](https://github.com/snake-in-prod/ado-gh/commit/{{ commit.id }}))\
{% endfor %}
{% endfor %}
"""
# No trim: each release body starts with a blank separator line (the header has
# no trailing newline) and the postprocessor ends it with exactly one newline.
trim = false
postprocessors = [{ pattern = '\n+\z', replace = "\n" }]

[git]
conventional_commits = true
filter_unconventional = false
require_conventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = true
# Only stable tags start a section; -rc.N tags fold into the next stable one.
tag_pattern = "^v[0-9]+\\.[0-9]+\\.[0-9]+$"
ignore_tags = "-rc\\.[0-9]+$"
sort_commits = "oldest"
# Collapse runs of spaces only: touching newlines would merge a
# BREAKING CHANGE footer into the subject and lose the breaking flag.
commit_preprocessors = [{ pattern = " {2,}", replace = " " }]
commit_parsers = [
  { field = "breaking", pattern = "true", group = "<!-- 0 -->⚠ Breaking Changes" },
  { message = "^(chore|test|style|ci|conductor)(\\(.*\\))?:", skip = true },
  # Conductor bookkeeping (e.g. docs(conductor)) never reaches users.
  { message = "^[a-z]+\\(conductor\\):", skip = true },
  { message = "^feat(\\(.*\\))?:", group = "<!-- 1 -->Features" },
  { message = "^fix(\\(.*\\))?:", group = "<!-- 2 -->Bug Fixes" },
  { message = "^perf(\\(.*\\))?:", group = "<!-- 3 -->Performance" },
  { message = "^docs(\\(.*\\))?:", group = "<!-- 4 -->Documentation" },
  # Everything else (refactor, build, revert, merges, ...) is dropped without
  # a warning; filter_unconventional = false routes non-conventional subjects here.
  { message = ".*", skip = true },
]
