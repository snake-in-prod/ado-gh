# Builds ado-<% .Name %> for six platforms when a v* tag is pushed, and publishes the binaries,
# checksums.txt and build-provenance attestations as a GitHub release. A tag with a "-", such
# as v1.0.0-rc.1, makes a prerelease.
name: release
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
  id-token: write
  attestations: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
<%- if eq .Kind "go" %>
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Build
        run: |
          for t in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os=${t%/*}; arch=${t#*/}; ext=; [ "$os" = windows ] && ext=.exe
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags="-s -w" -o "dist/ado-<% .Name %>-$os-$arch$ext"
          done
<%- else %>
      - name: Build
        run: script/build.sh
<%- end %>
      - name: Checksums
        run: cd dist && sha256sum * > checksums.txt
      # Attestations need a public repository (or GitHub Enterprise Cloud); remove this step otherwise.
      - uses: actions/attest-build-provenance@v3
        with:
          subject-path: dist/ado-<% .Name %>-*
      - name: Release
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
        env:
          GH_TOKEN: ${{ github.token }}
